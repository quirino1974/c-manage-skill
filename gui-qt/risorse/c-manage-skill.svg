<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6FE0"/>
      <stop offset="1" stop-color="#6A3FD1"/>
    </linearGradient>
    <linearGradient id="carta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEFB"/>
    </linearGradient>
    <linearGradient id="arancio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#F07A1A"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#10183A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- fondo arrotondato -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#fondo)"/>
  <rect x="8" y="8" width="240" height="120" rx="52" fill="#FFFFFF" opacity="0.07"/>

  <!-- tre schede impilate: le skill -->
  <g filter="url(#ombra)">
    <rect x="70" y="46" width="118" height="146" rx="16" fill="#FFFFFF" opacity="0.35" transform="rotate(8 129 119)"/>
    <rect x="62" y="50" width="118" height="146" rx="16" fill="#FFFFFF" opacity="0.6" transform="rotate(-6 121 123)"/>
    <rect x="58" y="56" width="122" height="150" rx="16" fill="url(#carta)"/>
  </g>

  <!-- contenuto della scheda: intestazione "SKILL.md" e righe di testo -->
  <rect x="74" y="74" width="54" height="12" rx="6" fill="#3B6FE0"/>
  <rect x="74" y="98" width="90" height="8" rx="4" fill="#B9C5E6"/>
  <rect x="74" y="114" width="78" height="8" rx="4" fill="#B9C5E6"/>
  <rect x="74" y="130" width="86" height="8" rx="4" fill="#B9C5E6"/>
  <rect x="74" y="146" width="56" height="8" rx="4" fill="#B9C5E6"/>

  <!-- distintivo: frecce di sincronizzazione -->
  <g filter="url(#ombra)">
    <circle cx="178" cy="178" r="44" fill="url(#arancio)"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156 170 a24 24 0 0 1 42 -10"/>
    <path d="M200 186 a24 24 0 0 1 -42 10"/>
  </g>
  <path d="M203 146 l-1 20 -19 -4 z" fill="#FFFFFF"/>
  <path d="M153 210 l1 -20 19 4 z" fill="#FFFFFF"/>
</svg>
